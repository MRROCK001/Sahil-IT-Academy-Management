<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Sahil IT Academy</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="container">

        <header>

            <h2>Sahil IT Academy</h2>

            <a href="dashboard.html" class="back-btn">
                ← Dashboard
            </a>

        </header>

        <div class="profile-card">

            

            <div class="profile-details">

                <div class="row">
                    <label>Name</label>
                    <span id="studentName">-</span>
                </div>

                <div class="row">
                    <label>Student ID</label>
                    <span id="studentId">-</span>
                </div>

                <div class="row">
                    <label>Course</label>
                    <span id="studentCourse">-</span>
                </div>

                <div class="row">
                    <label>Mobile</label>
                    <span id="studentMobile">-</span>
                </div>

            </div>

        </div>

    </div>

    <script src="profile.js"></script>

</body>

</html>
