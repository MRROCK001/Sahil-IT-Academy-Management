<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>

    <link rel="stylesheet" href="courses.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>📚 Course Management</h1>

        <form id="courseForm">

            <input
                type="text"
                id="courseName"
                placeholder="Course Name"
                required>

            <input
                type="number"
                id="courseFees"
                placeholder="Course Fees"
                required>

            <input
                type="text"
                id="courseDuration"
                placeholder="Course Duration (Example: 3 Months)"
                required>

            <button type="submit">
                ➕ Add Course
            </button>

        </form>

        <hr>

        <h2>Course List</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Course Name</th>
                    <th>Fees</th>
                    <th>Duration</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="courseList">

            </tbody>

        </table>

        <br>

        <button type="button" onclick="window.location.href='dashboard.html'">
            ⬅ Back To Dashboard
        </button>

    </div>

    <script type="module" src="courses.js"></script>

</body>

</html>
