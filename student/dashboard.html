<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Sahil IT Academy</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="container">

        <header>
            <h2>Sahil IT Academy</h2>

            <button id="logoutBtn">Logout</button>
        </header>

        <div class="welcome-card">
            <h3>Welcome 👋</h3>
            <h2 id="studentName">Student Name</h2>
        </div>

        <div class="details-card">

            <div class="detail">
                <span>Student ID</span>
                <h3 id="studentId">-</h3>
            </div>

            <div class="detail">
                <span>Course</span>
                <h3 id="studentCourse">-</h3>
            </div>

            <div class="detail">
                <span>Mobile</span>
                <h3 id="studentMobile">-</h3>
            </div>

        </div>

        <div class="menu">

            <a href="profile.html" class="card">
                👤
                <h3>Profile</h3>
            </a>

            <a href="certificate.html" class="card">
                📄
                <h3>Certificate</h3>
            </a>

        </div>

    </div>

    <script type="module" src="dashboard.js"></script>

</body>

</html>
