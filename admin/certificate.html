<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Generator</title>

    <link rel="stylesheet" href="certificate.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="page">

    <!-- Toolbar -->

    <div class="toolbar">

        <h2>Certificate Generator</h2>

        <div class="controls">

            <select id="studentSelect">

                <option value="">Select Student</option>

            </select>

            <input type="date" id="issueDate">

            <button id="generateBtn">

                Generate Certificate

            </button>

        </div>

    </div>

    <!-- Certificate -->

    <div id="certificate" class="certificate">

        <div class="inner-border">

            <!-- Logo -->

            <div class="logo">

                🎓

            </div>

            <!-- Academy -->

            <h1 class="academy-name">

                SAHIL IT ACADEMY

            </h1>

            <p class="academy-tag">

                Empowering Skills • Building Careers

            </p>

            <p class="certificate-title">

                CERTIFICATE OF COMPLETION

            </p>

            <p class="certificate-text">

                This Certificate is proudly presented to

            </p>

            <h1 id="studentName">

                Student Name

            </h1>

            <p class="certificate-text">

                For Successfully Completing

            </p>

            <h2 id="courseName">

                Course Name

            </h2>

            <div class="info">

                <div>

                    <strong>Student ID</strong>

                    <p id="studentId"></p>

                </div>

                <div>

                    <strong>Certificate No</strong>

                    <p id="certificateNo"></p>

                </div>

                <div>

                    <strong>Date</strong>

                    <p id="issueDateText"></p>

                </div>

            </div>

            <div class="signature">

                <div>

                    ______________________

                    <br>

                    Director

                </div>

            </div>

        </div>

    </div>

    <div class="actions">

        <button id="downloadPdfBtn">

            Download PDF

        </button>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script type="module" src="certificate.js"></script>

</body>

</html>
